name: PR preview

on:
  pull_request:
    branches: [hugo]
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Branch PRs only; forks get no write token or secrets
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Checkout hugo-academic
        uses: actions/checkout@v7
        with:
          repository: gcushen/hugo-academic
          ref: v4.8.0
          path: themes/hugo-academic

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Build
        run: >-
          hugo --minify
          --baseURL "https://${{ github.repository_owner }}.github.io/pr-preview/pr-${{ github.event.pull_request.number }}/"
          --destination site

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/

  preview:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site/

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          action: deploy
          pr-number: ${{ github.event.pull_request.number }}
          source-dir: ./site
          preview-branch: master
          umbrella-dir: pr-preview
          comment: true

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          action: remove
          pr-number: ${{ github.event.pull_request.number }}
          preview-branch: master
          umbrella-dir: pr-preview
          comment: true
