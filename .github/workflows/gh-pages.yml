name: github pages

on:
  push:
    branches:
      - hugo  # default branch

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout hugo branch
        uses: actions/checkout@v7

      - name: Checkout master
        uses: actions/checkout@v7
        with:
          repository: gliptak/gliptak.github.io
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master
          path: ${{ github.workspace }}/public

      - name: Checkout hugo-academic
        uses: actions/checkout@v7
        with:
          repository: gcushen/hugo-academic
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: v4.8.0
          path: ${{ github.workspace }}/themes/hugo-academic

      - name: Find
        run: |
          find /home/runner/work/gliptak.github.io/

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Setup Dart Sass
        run: |
          curl -sSL https://github.com/sass/dart-sass/releases/download/1.99.0/dart-sass-1.99.0-linux-x64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Build
        run: hugo --debug

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master  # deploying branch
          keep_files: true  # preserve pr-preview/ directories